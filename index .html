<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SpendWise</h1>
        <p>Track your income and expenses in one place</p>
    </header>

    <main>

        <!-- Budget Section -->
        <section class="card">
            <h2>My Budget</h2>

            <label for="budget">Enter Budget:</label>
            <input type="number" id="budget" placeholder="Enter your budget">

            <button id="setBudgetBtn">Set Budget</button>

            <h3>Budget: KSh <span id="budgetDisplay">5000</span></h3>
            <h3>Total Expenses: KSh <span id="expenseDisplay">50000</span></h3>
            <h3>Balance: KSh <span id="balanceDisplay">5000</span></h3>

            <p id="budgetMessage"></p>
        </section>


        <!-- Add Expense Section -->
        <section class="card">
            <h2>Add Expense</h2>

            <form id="expenseForm">

                <label for="expenseName">Expense Name:</label>
                <input 
                    type="text" 
                    id="expenseName" 
                    placeholder="e.g. Food" 
                    required
                >

                <label for="expenseAmount">Amount:</label>
                <input 
                    type="number" 
                    id="expenseAmount" 
                    placeholder="e.g. 500" 
                    required
                >

                <label for="expenseCategory">Category:</label>
                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Utilities">Utilities</option>
                </select>

                <button type="submit">Add Expense</button>

            </form>
        </section>


        <!-- Expenses Section -->
        <section class="card">
            <h2>My Expenses</h2>

            <div id="expenseList">
                <p>No expenses yet.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
